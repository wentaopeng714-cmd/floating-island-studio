<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#21364a"><title>云上游乐场</title><link rel="stylesheet" href="./arcade.css"></head><body class="play">
<header class="play-header"><a class="back" href="./arcade.html">← 游乐场</a><div class="game-brand"><span id="gameNumber">01</span><div><strong id="gameName"></strong><small id="gameEnglish"></small></div></div><div class="header-actions"><button id="music" aria-label="开启音乐" title="开启音乐">♫</button><button id="weather" title="切换天气">☀ 晴朗</button><button id="help" aria-label="玩法说明">?</button><button id="restart">重开</button></div></header>
<main class="play-layout"><section class="world" aria-label="3D 游戏场景"><div id="viewport"></div><div class="world-title"><span class="eyebrow" id="gameTag"></span><h1 id="caption"></h1></div><div class="world-bottom"><span>拖动旋转 · 滚轮缩放 · 点击格子操作</span><div><button id="pause" title="暂停动画">Ⅱ</button><button id="speed" title="动画速度">1×</button><button id="resetView" aria-label="恢复视角">⌖</button></div></div><div class="hover-tip" id="hoverTip" hidden></div><div class="toast" id="toast" role="status" aria-live="polite"></div><div class="legend" id="legend"></div></section>
<aside class="game-panel"><div class="panel-scroll"><div class="panel-intro"><p class="eyebrow">YOUR LITTLE MISSION</p><h2>这一局的小目标</h2><p id="goal"></p></div><div class="progress-track"><i id="progress"></i></div><div id="metrics" class="metrics"></div><div class="task-list" id="tasks"></div><section class="tools-section"><div class="section-label"><h3 id="toolTitle">选择你的工具</h3><span id="turn"></span></div><div id="tools" class="tools"></div></section><div id="destination" class="destination" hidden><span>这趟去哪儿？</span><div><button data-dest="town">东部小镇</button><button data-dest="farm">北部农场</button></div></div><div class="status-message" id="message" aria-live="polite"></div></div><div class="panel-footer"><button class="main-action" id="advance"></button><p class="save-note">进度保存在当前浏览器 · 各款独立保存</p></div></aside></main>
<dialog id="guide"><span class="eyebrow">HOW TO PLAY</span><h2 id="guideTitle"></h2><p id="guideText"></p><div class="guide-goal" id="guideGoal"></div><button class="main-action" id="closeGuide">开始这一局 →</button></dialog>
<dialog id="result"><span class="eyebrow" id="resultTag"></span><h2 id="resultTitle"></h2><p id="resultText"></p><div class="result-buttons"><button class="main-action" id="again">再玩一局</button><a href="./arcade.html">去看看其他小岛 →</a><button class="text-button" id="viewResult">欣赏这座岛</button></div></dialog>
<script type="module" src="./play.js"></script></body></html>
