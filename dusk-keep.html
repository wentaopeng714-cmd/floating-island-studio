="音乐">♫</button><button id="help" aria-label="玩法说明">?</button><button id="reset" aria-label="重新开始">↻</button></div></div><div class="battle-hud"><div class="health"><span>♥ 城堡生命</span><b id="hp"></b><div class="progress"><i id="healthBar"></i></div></div><div class="wave"><small>入侵波次</small><b id="wave"></b></div><div class="gold"><span>◈ 金币</span><b id="gold"></b></div></div><section class="tower-armory"><span class="eyebrow">DEFENSE ARSENAL</span><div class="tool" id="towers"></div><p>点击圆形点建塔<br>点击已有塔升级，最高 3 级</p></section><button class="freeze" id="freeze"><span>❄</span><strong>冰霜之息</strong><small>每波一次 · 冻结全场</small></button><div class="battle-command"><span id="message"></span><button class="primary" id="next">迎战第一波 →</button></div><div class="instruction">1 / 2 / 3 选择防御塔 · 点击建造或升级 · 空格释放冰冻</div><div class="battle-flash" id="flash"></div><div class="toast" id="toast" role="status" aria-live="polite"></div><dialog id="guide"><span class="eyebrow">HOW TO PLAY</span><h2>玩法说明</h2><p id="guideText"></p><button class="primary" id="closeGuide">知道了</button></dialog><dialog id="result"><span class="eyebrow">YOUR STORY</span><h2 id="resultTitle"></h2><p id="resultText"></p><button class="primary" id="again">再玩一局</button><button class="secondary" id="stay">留在这里欣赏</button></dialog><script type="module">import * as THREE from "./three.module.js";
import {makeModel} from "./models.js";

function graphics(el,{sky='#d6e5df',view=7,az=.6,elev=.8,orbit=true,look=[0,0,0],sunColor='#fff0d3'}={}){
 const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.06;renderer.outputColorSpace=THREE.SRGBColorSpace;el.append(renderer.domElement);
 const scene=new THREE.Scene();scene.background=new THREE.Color(sky);const camera=new THREE.OrthographicCamera(-10,10,7,-7,.1,100);const hemi=new THREE.HemisphereLight('#f5fff3','#7e8598',1.3);scene.add(hemi);const sun=new THREE.DirectionalLight(sunColor,2.3);sun.position.set(-5,13,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20});sun.shadow.bias=-.001;scene.add(sun);const fill=new THREE.DirectionalLight('#b3d9ef',.4);fill.position.set(10,8,-10);scene.add(fill);
 const root=new THREE.Group();scene.add(root);const cache=new Map();const mat=color=>{if(!cache.has(color))cache.set(color,new THREE.MeshStandardMaterial({color,flatShading:true,roughness:.96}));return cache.get(color);};
 function mesh(parent,geo,color,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
 const box=(p,w,h,d,c,x=0,y=0,z=0)=>mesh(p,new THREE.BoxGeometry(w,h,d),c,x,y,z);
 const sphere=(p,r,c,x=0,y=0,z=0)=>mesh(p,new THREE.IcosahedronGeometry(r,1),c,x,y,z);
 const cone=(p,r,h,c,x=0,y=0,z=0,n=6)=>mesh(p,new THREE.ConeGeometry(r,h,n),c,x,y,z);
 const cylinder=(p,r,h,c,x=0,y=0,z=0,n=16)=>mesh(p,new THREE.CylinderGeometry(r,r,h,n),c,x,y,z);
 const group=(parent=root)=>{const g=new THREE.Group();parent.add(g);return g;};
 function model(type,x,z,scale=1,parent=root,y=.015){const g=makeModel(type);g.position.set(x,y,z);g.scale.multiplyScalar(scale);parent.add(g);return g;}
 function land(points,{color='#83bea0',edge='#a78867',depth=.65,y=0,parent=root}={}){const shape=new THREE.Shape();points.forEach(([x,z],i)=>i?shape.lineTo(x,-z):shape.moveTo(x,-z));shape.closePath();const geo=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:false});geo.rotateX(-Math.PI/2);const m=new THREE.Mesh(geo,[mat(color),mat(edge)]);m.position.y=y-depth;m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
 function ellipse(x,z,rx,rz,{color,edge,depth,y,parent}={}){return land(Array.from({length:24},(_,i)=>{const a=i*Math.PI/12,r=1+.045*Math.sin(i*2.3);return [x+Math.cos(a)*rx*r,z+Math.sin(a)*rz*r];}),{color,edge,depth,y,parent});}
 function line(points,color='#d6c8a6',width=.025,parent=root){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));return mesh(parent,new THREE.TubeGeometry(curve,Math.max(24,points.length*10),width,5,false),color);}
 function road(points,width=.6,color='#ddc6a0',parent=root,y=.027){for(let i=0;i<points.length-1;i++){const [x,z]=points[i],[a,b]=points[i+1],length=Math.hypot(a-x,b-z),m=box(parent,width,.03,length+.08,color,(x+a)/2,y,(z+b)/2);m.rotation.y=Math.atan2(a-x,b-z);}for(const [x,z]of points)cylinder(parent,width/2,.032,color,x,y,z,12);}
 function rail(points,parent=root){for(let i=0;i<points.length-1;i++){const [x,z]=points[i],[a,b]=points[i+1],len=Math.hypot(a-x,b-z),dx=(a-x)/len,dz=(b-z)/len;for(const off of [-.16,.16])line([[x+dz*off,.075,z-dx*off],[a+dz*off,.075,b-dx*off]],'#526c76',.022,parent);for(let d=.14;d<len;d+=.3){const sleeper=box(parent,.52,.04,.095,'#bc9c74',x+dx*d,.04,z+dz*d);sleeper.rotation.y=Math.atan2(dx,dz);}}}
 function ring(x,z,r,color='#c9e7c2',parent=root){const geo=new THREE.RingGeometry(r-.025,r,48);geo.rotateX(-Math.PI/2);return mesh(parent,geo,color,x,.04,z);}
 function clear(parent){for(const c of [...parent.children]){parent.remove(c);c.traverse(o=>o.geometry?.dispose());}}
 const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hit=new THREE.Vector3();let zoom=1,start=null,dragged=false,pinch=0;const fingers=new Map();let click=()=>{},hover=()=>{};
 function point(e){const r=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mouse,camera);return ray.ray.intersectPlane(plane,hit)?{x:hit.x,z:hit.z}:null;}
 function cameraUpdate(){const d=24;camera.position.set(look[0]+Math.sin(az)*Math.cos(elev)*d,look[1]+Math.sin(elev)*d,look[2]+Math.cos(az)*Math.cos(elev)*d);camera.lookAt(...look);camera.updateMatrixWorld();}
 function resize(){const w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h,false);const aspect=w/h,v=Math.max(view*.64,view/aspect)/zoom;camera.left=-v*aspect;camera.right=v*aspect;camera.top=v;camera.bottom=-v;camera.updateProjectionMatrix();cameraUpdate();}
 renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(fingers.size===1){start={x:e.clientX,y:e.clientY};dragged=false;}else{dragged=true;const a=[...fingers.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}});
 renderer.domElement.addEventListener('pointermove',e=>{hover(point(e),e);if(!fingers.has(e.pointerId))return;const prev=fingers.get(e.pointerId);fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(fingers.size===2){const a=[...fingers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch){zoom=Math.max(.75,Math.min(1.8,zoom*d/pinch));resize();}pinch=d;return;}if(start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>6)dragged=true;if(dragged&&orbit){az-=(e.clientX-prev.x)*.007;elev=Math.max(.32,Math.min(1.35,elev+(e.clientY-prev.y)*.006));cameraUpdate();}});
 renderer.domElement.addEventListener('pointerup',e=>{const single=fingers.size===1;fingers.delete(e.pointerId);if(single&&!dragged&&start){const p=point(e);if(p)click(p,e);}start=null;pinch=0;});renderer.domElement.addEventListener('pointercancel',e=>{fingers.delete(e.pointerId);start=null;});renderer.domElement.addEventListener('pointerleave',()=>hover(null,{}));renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.75,Math.min(1.8,zoom*(e.deltaY>0?.92:1.08)));resize();},{passive:false});
 const observer=new ResizeObserver(resize);observer.observe(el);resize();let update=()=>{},last=performance.now(),time=0;
 function frame(now){requestAnimationFrame(frame);let dt=Math.min(.06,(now-last)/1000);last=now;if(document.hidden||document.querySelector('dialog[open]'))dt=0;time+=dt;update(dt,time);renderer.render(scene,camera);}requestAnimationFrame(frame);
 return {THREE,renderer,scene,camera,root,sun,hemi,mat,mesh,box,sphere,cone,cylinder,group,model,land,ellipse,line,road,rail,ring,clear,pick(e,objects){point(e);const hits=ray.intersectObjects(objects,true);return hits[0]?.object;},onClick(fn){click=fn;},onHover(fn){hover=fn;},onFrame(fn){update=fn;},project(x,y,z){const p=new THREE.Vector3(x,y,z).project(camera),r=el.getBoundingClientRect();return {x:(p.x+1)*r.width/2,y:(1-p.y)*r.height/2};}};
}
function clouds(g,{color='#f1f5e8',y=4,count=6}={}){const group=g.group();const all=[];for(let i=0;i<count;i++){const c=g.group(group);for(const [x,yy,z,r]of [[0,0,0,.6],[-.5,0,0,.4],[.5,-.1,0,.45],[.1,.2,0,.45]])g.sphere(c,r,color,x,yy,z);c.position.set(-8+i*3,y+(i%2)*.7,-5+(i%3)*4);all.push(c);}return {group,update(t){all.forEach((c,i)=>{c.position.x=-8+i*3+Math.sin(t*.08+i)*.7;});}};}
function trainModel(g,parent=g.root){const t=g.group(parent);g.box(t,.55,.35,.9,'#cc714c',0,.3,0);g.box(t,.4,.4,.4,'#ede4bc',0,.45,-.18);g.box(t,.49,.08,.49,'#4e6b77',0,.7,-.18);g.cylinder(t,.075,.27,'#4e6b77',0,.66,.25,8);for(const x of [-.28,.28])for(const z of [-.27,.27])g.sphere(t,.12,'#425b64',x,.15,z);const cargo=g.box(t,.38,.23,.46,'#e0ba70',0,.36,-1.05);g.box(t,.55,.15,.7,'#967551',0,.2,-1.05);for(const x of [-.28,.28])for(const z of [-.85,-1.25])g.sphere(t,.1,'#425b64',x,.1,z);t.userData.cargo=cargo;return t;}

const $=s=>document.querySelector(s);
function storage(key,initial){let state=initial();try{const saved=JSON.parse(localStorage.getItem(key));if(saved?.version===state.version&&saved.kind===state.kind)state=saved;}catch{}return {get state(){return state;},set state(v){state=v;},save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{}}};}
function toast(message){const el=$('#toast');if(!el)return;el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2500);}
function music(button,{notes=[72,76,79,74,69,72,67,74],tempo=500,wave='sine'}={}){let audio=null,timer=null,gain=null,i=0,on=false;button.addEventListener('click',async()=>{try{if(on){clearInterval(timer);gain.gain.setTargetAtTime(0,audio.currentTime,.1);on=false;}else{if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)();gain=audio.createGain();gain.gain.value=.04;gain.connect(audio.destination);}await audio.resume();gain.gain.setTargetAtTime(.04,audio.currentTime,.1);on=true;const note=()=>{const o=audio.createOscillator(),e=audio.createGain(),at=audio.currentTime;o.type=wave;o.frequency.value=440*2**((notes[i++%notes.length]-69)/12);e.gain.setValueAtTime(.001,at);e.gain.exponentialRampToValueAtTime(.55,at+.015);e.gain.exponentialRampToValueAtTime(.001,at+1.2);o.connect(e).connect(gain);o.start(at);o.stop(at+1.25);};note();timer=setInterval(note,tempo);}button.setAttribute('aria-pressed',String(on));button.setAttribute('aria-label',on?'关闭音乐':'开启音乐');toast(on?'音乐已开启':'音乐已关闭');}catch{toast('当前浏览器无法开启音频。');}});}
function result(title,text,onAgain){$('#resultTitle').textContent=title;$('#resultText').textContent=text;$('#result').showModal();$('#again').onclick=()=>{$('#result').close();onAgain();};$('#stay').onclick=()=>$('#result').close();}

const TOWERS={arrow:{name:'箭塔',cost:25,range:2.6,rate:.52,damage:1.5,model:'watchtower'},ice:{name:'冰塔',cost:35,range:2.6,rate:1.0,damage:1,model:'roundtower',slow:true},heavy:{name:'重弩',cost:45,range:3.3,rate:1.25,damage:4,model:'smithy'}};
function initial(){return {version:2,kind:'keep',gold:100,hp:12,wave:0,battle:false,towers:[],enemies:[],shots:[],spawn:0,spawnTime:0,nextEnemy:1,kills:0,freeze:0,spell:true,status:'playing',message:'点击圆形建塔点，放下你的第一座塔。'};}
function build(s,type,pad){if(s.status!=='playing'||!PADS[pad])return false;const t=s.towers.find(t=>t.pad===pad);if(t){const price=20*t.level;if(t.level>=3){s.message='这座塔已经达到 3 级。';return false;}if(s.gold<price){s.message=`升级需要 ${price} 金币。`;return false;}s.gold-=price;t.level++;s.message=`防御塔升至 ${t.level} 级，攻击和射程提高。`;return true;}const data=TOWERS[type];if(!data||s.gold<data.cost){s.message='金币不够，击败敌人能获得金币。';return false;}s.gold-=data.cost;s.towers.push({type,pad,level:1,cooldown:0});s.message='防御塔就位，点击已有塔可升级。';return true;}
function startWave(s){if(s.status!=='playing'||s.battle)return false;s.wave++;s.battle=true;s.spawn=0;s.spawnTime=.95;s.spell=true;s.message=`第 ${s.wave} 波接近山谷！`;return true;}
function freeze(s){if(!s.battle||!s.spell||s.status!=='playing'){s.message='冰冻技能只能在战斗中使用，每波一次。';return false;}s.spell=false;s.freeze=3.5;s.message='冰霜覆盖道路，所有小怪冻结 3.5 秒。';return true;}
const length=ROAD.slice(1).reduce((n,p,i)=>n+Math.hypot(p[0]-ROAD[i][0],p[1]-ROAD[i][1]),0);
function roadPoint(distance){for(let i=1;i<ROAD.length;i++){const a=ROAD[i-1],b=ROAD[i],d=Math.hypot(b[0]-a[0],b[1]-a[1]);if(distance<=d)return [a[0]+(b[0]-a[0])*distance/d,a[1]+(b[1]-a[1])*distance/d];distance-=d;}return ROAD.at(-1);}
function tick(s,dt){if(!s.battle||s.status!=='playing')return false;s.shots=s.shots.filter(p=>(p.life-=dt)>0);s.freeze=Math.max(0,s.freeze-dt);s.spawnTime+=dt;const count=4+s.wave;let changed=false;
 if(s.spawn<count&&s.spawnTime>=1.05){s.spawnTime-=1.05;const hp=3+s.wave*1.2;s.enemies.push({id:s.nextEnemy++,hp,max:hp,distance:0,slow:0});s.spawn++;}
 for(const e of s.enemies){e.slow=Math.max(0,e.slow-dt);if(!s.freeze)e.distance+=dt*(.76+s.wave*.03)*(e.slow>0?.45:1);}
 for(const tower of s.towers){const d=TOWERS[tower.type],pos=PADS[tower.pad];tower.cooldown=Math.max(0,tower.cooldown-dt);if(tower.cooldown>0)continue;const e=s.enemies.filter(e=>e.hp>0).sort((a,b)=>b.distance-a.distance).find(e=>{const p=roadPoint(e.distance);return Math.hypot(pos[0]-p[0],pos[1]-p[1])<=d.range+(tower.level-1)*.25;});if(e){e.hp-=d.damage*(1+(tower.level-1)*.5);if(d.slow)e.slow=2.5;tower.cooldown=d.rate;s.shots.push({from:pos,to:roadPoint(e.distance),ice:!!d.slow,life:.15});}}
 s.enemies=s.enemies.filter(e=>{if(e.hp<=0){s.gold+=6;s.kills++;changed=true;return false;}if(e.distance>=length){s.hp--;changed=true;return false;}return true;});
 if(s.hp<=0){s.hp=0;s.status='lost';s.battle=false;s.shots=[];s.message='城堡失守。把塔放在道路拐角，再试一次。';return true;}if(s.spawn===count&&!s.enemies.length){s.battle=false;s.shots=[];s.gold+=25;if(s.wave===5)s.status='won';s.message=`守住第 ${s.wave} 波，获得 25 金币。`;return true;}return changed;
}

const db=storage('dusk-keep-independent-v2',initial);let s=db.state,selected='arrow',finished=false;if(s.battle){s.battle=false;s.wave--;s.enemies=[];s.shots=[];}
const g=graphics($('#stage'),{sky:'#242338',view:8.6,az:.44,elev:.64,look:[0,0,.1],sunColor:'#d9b3a9'});g.sun.intensity=1.6;g.hemi.intensity=.98;
g.ellipse(0,0,6.45,3.4,{color:'#657d6b',edge:'#666172',depth:1.05});g.road(ROAD,.72,'#a3937e');g.model('castle',4.8,-.8,1.22);g.model('gate',4.05,.05,.82);
for(const [x,z,scale]of [[-4.3,-1.9,1.7],[-2.3,-2.1,1.3],[.2,-2.65,1.1],[3,-2.2,1.3]])g.model('mountain',x,z,scale);for(const [type,x,z,scale]of [['pine',-5,-.5,1.1],['fir',-4.65,.8,.8],['cypress',-1.8,-1.9,1.2],['rocks',-1.3,2.5,.8],['pine',3.8,2.1,1.0],['lantern',4.7,.4,.8]])g.model(type,x,z,scale);
for(const [x,z]of PADS){g.cylinder(g.root,.44,.085,'#8d8e8e',x,.04,z,12);g.ring(x,z,.38,'#b1b0a0');}g.model('campfire',3.4,1.4,.65);
const starsGeo=new THREE.BufferGeometry(),starPos=[];for(let i=0;i<90;i++)starPos.push((Math.random()-.5)*34,7+Math.random()*10,-8-Math.random()*12);starsGeo.setAttribute('position',new THREE.Float32BufferAttribute(starPos,3));g.scene.add(new THREE.Points(starsGeo,new THREE.PointsMaterial({color:'#b6afcf',size:.04,sizeAttenuation:true})));
const towers=g.group(),enemies=g.group(),shots=g.group(),range=g.group(),enemyMap=new Map();let oldHP=s.hp,visualSig='';const near=p=>{let index=-1,min=.62;PADS.forEach(([x,z],i)=>{const d=Math.hypot(p.x-x,p.z-z);if(d<min){min=d;index=i;}});return index;};
function armory(){const el=$('#towers');el.innerHTML='';Object.entries(TOWERS).forEach(([id,t],i)=>{const b=document.createElement('button');b.className=selected===id?'active':'';b.dataset.tower=id;b.innerHTML=`<b>${{arrow:'♜',ice:'❄',heavy:'➶'}[id]}</b><span><strong>${i+1} · ${t.name}</strong><small>${t.cost} 金 · ${id==='arrow'?'射速快':id==='ice'?'减速敌人':'高伤害'}</small></span>`;b.onclick=()=>{selected=id;armory();};el.append(b);});}
function draw(){const sig=JSON.stringify(s.towers.map(({type,pad,level})=>({type,pad,level})));if(sig!==visualSig){visualSig=sig;g.clear(towers);for(const t of s.towers){const [x,z]=PADS[t.pad],data=TOWERS[t.type],m=g.model(data.model,x,z,.82+(t.level-1)*.08,towers,.08);m.traverse(o=>o.userData.pad=t.pad);if(t.type==='heavy'){g.box(m,.7,.1,.11,'#b4a388',0,.5,.2);g.box(m,.11,.1,.7,'#ba9a7c',0,.55,.2);}for(let n=0;n<t.level;n++)g.sphere(m,.035,'#f2cf90',-.12+n*.12,.31,.48);}}
 $('#gold').textContent=s.gold;$('#hp').textContent=`${s.hp} / 12`;$('#healthBar').style.width=`${s.hp/12*100}%`;$('#wave').textContent=`${s.wave} / 5`;$('#message').textContent=s.message;$('#next').textContent=s.battle?`第 ${s.wave} 波交战中`:`${s.wave?'迎战下一波':'迎战第一波'} →`;$('#next').disabled=s.battle||s.status!=='playing';$('#freeze').disabled=!s.battle||!s.spell||s.status!=='playing';armory();db.state=s;db.save();
 if(s.hp<oldHP){$('#flash').classList.add('active');setTimeout(()=>$('#flash').classList.remove('active'),250);}oldHP=s.hp;
 if(s.status!=='playing'&&!finished){finished=true;result(s.status==='won'?'山谷守住了':'城堡失守了',s.status==='won'?`你挡住了五波入侵，击败 ${s.kills} 个敌人，城堡还剩 ${s.hp} 点生命。`:'下次在道路拐角集中火力，升级已有塔，并在敌人密集时释放冰霜之息。',reset);}
}
function reset(){s=initial();finished=false;oldHP=12;visualSig='';g.clear(enemies);enemyMap.clear();draw();}
g.onClick((p,e)=>{const hit=g.pick(e,towers.children),i=hit?.userData.pad??near(p);if(i<0){toast('请点击五个圆形石头建塔点。');return;}build(s,selected,i);toast(s.message);draw();});g.onHover(p=>{g.clear(range);const i=p?near(p):-1;if(i>=0){const [x,z]=PADS[i],t=s.towers.find(t=>t.pad===i),r=TOWERS[t?.type||selected].range+(t?(t.level-1)*.25:0);const m=g.ring(x,z,r,'#aabfcd',range);m.material=m.material.clone();m.material.transparent=true;m.material.opacity=.35;}});
const beamMats={ice:new THREE.LineBasicMaterial({color:'#bee4f5'}),normal:new THREE.LineBasicMaterial({color:'#e1c38c'})};
g.onFrame((dt,time)=>{if(dt>0&&tick(s,dt))draw();const ids=new Set(s.enemies.map(e=>e.id));for(const [id,m]of enemyMap)if(!ids.has(id)){enemies.remove(m);m.traverse(o=>o.geometry?.dispose());enemyMap.delete(id);}for(const e of s.enemies){let m=enemyMap.get(e.id);if(!m){m=g.group(enemies);const body=g.sphere(m,.23,'#be8699',0,.28,0);body.scale.y=1.3;g.cone(m,.24,.17,'#b5a384',0,.59,0,4);for(const x of [-.085,.085])g.sphere(m,.027,'#f1d89e',x,.37,.21);m.userData.bar=g.box(m,.42,.04,.055,'#c6d1a9',0,.76,0);enemyMap.set(e.id,m);}const [x,z]=roadPoint(e.distance);m.position.set(x,s.freeze?0:Math.sin(time*9+e.id)*.025,z);m.userData.bar.scale.x=Math.max(.01,e.hp/e.max);m.children[0].material=g.mat(s.freeze?'#a2c4d9':'#be8699');}g.clear(shots);for(const shot of s.shots){const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(shot.from[0],1.1,shot.from[1]),new THREE.Vector3(shot.to[0],.4,shot.to[1])]);shots.add(new THREE.Line(geo,beamMats[shot.ice?'ice':'normal']));}});
$('#next').onclick=()=>{startWave(s);toast(s.message);draw();};$('#freeze').onclick=()=>{freeze(s);toast(s.message);draw();};document.addEventListener('keydown',e=>{if(document.querySelector('dialog[open]'))return;if(['1','2','3'].includes(e.key)){selected=Object.keys(TOWERS)[Number(e.key)-1];armory();}if(e.code==='Space'){e.preventDefault();freeze(s);toast(s.message);draw();}});guide('圆形石头是固定建塔点。选右侧箭塔、冰塔或重弩，再点击建造。点击已有塔可升级，最多 3 级：升级消耗 20 / 40 金，增加攻击和射程。迎战后，塔会自动攻击。每波有一次冰霜之息，可冻结全部敌人 3.5 秒。击败敌人和守住一波都会获得金币，保护城堡通过五波即可完成。');music($('#music'),{notes:[48,55,60,55,45,52,57,52],tempo:710,wave:'triangle'});resetButton(reset);draw();
</script></body></html>
